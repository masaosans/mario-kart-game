<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🏎️ ブラウザ版マリオカート</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1a1a2e; overflow: hidden; touch-action: none; font-family: 'Segoe UI', sans-serif; }
canvas { display: block; }

/* スタート画面 */
#startScreen {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: linear-gradient(135deg, #e74c3c, #f39c12, #2ecc71, #3498db);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  z-index: 100; animation: bgShift 5s ease infinite;
}
@keyframes bgShift {
  0%,100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}
#startScreen h1 { font-size: clamp(2rem, 8vw, 4rem); color: #fff; text-shadow: 3px 3px 0 #e74c3c, -1px -1px 0 #f39c12; margin-bottom: 10px; }
#startScreen .subtitle { font-size: clamp(0.8rem, 3vw, 1.2rem); color: rgba(255,255,255,0.9); margin-bottom: 30px; }
#startBtn {
  padding: 15px 50px; font-size: clamp(1.2rem, 4vw, 1.8rem); border: none; border-radius: 50px;
  background: #fff; color: #e74c3c; font-weight: bold; cursor: pointer;
  box-shadow: 0 6px 20px rgba(0,0,0,0.3); transition: transform 0.2s;
}
#startBtn:hover { transform: scale(1.1); }
.kart-emoji { font-size: clamp(3rem, 10vw, 5rem); margin-bottom: 20px; animation: bounce 1s ease infinite; }
@keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-20px)} }

/* コントロール */
#controls {
  position: fixed; bottom: 0; left: 0; width: 100%; padding: 10px;
  display: none; z-index: 50;
}
.ctrl-row { display: flex; justify-content: space-between; align-items: center; }
.dpad { display: grid; grid-template-columns: repeat(3, 60px); grid-template-rows: repeat(3, 60px); gap: 4px; }
.dpad-btn {
  width: 60px; height: 60px; border-radius: 12px; border: 3px solid rgba(255,255,255,0.5);
  background: rgba(255,255,255,0.15); color: #fff; font-size: 24px; display: flex;
  align-items: center; justify-content: center; cursor: pointer; user-select: none;
  -webkit-user-select: none; touch-action: manipulation;
}
.dpad-btn:active { background: rgba(255,255,255,0.4); }
.dpad-center { visibility: hidden; }
.action-btns { display: flex; gap: 10px; }
.action-btn {
  width: 70px; height: 70px; border-radius: 50%; border: 3px solid rgba(255,255,255,0.5);
  background: rgba(255,255,255,0.15); color: #fff; font-size: 14px; font-weight: bold;
  display: flex; align-items: center; justify-content: center; cursor: pointer;
  user-select: none; -webkit-user-select: none; touch-action: manipulation;
}
.action-btn:active { background: rgba(255,255,255,0.4); }
#boostBtn { background: rgba(231,76,60,0.4); border-color: #e74c3c; }
#itemBtn { background: rgba(243,156,18,0.4); border-color: #f39c12; }

/* HUD */
#hud {
  position: fixed; top: 10px; left: 10px; right: 10px; display: none; z-index: 50;
  justify-content: space-between; align-items: flex-start; pointer-events: none;
}
.hud-box {
  background: rgba(0,0,0,0.6); color: #fff; padding: 8px 14px; border-radius: 10px;
  font-size: clamp(0.7rem, 2.5vw, 0.9rem); backdrop-filter: blur(5px);
}
.hud-box .label { opacity: 0.7; }
.hud-box .value { font-weight: bold; font-size: 1.3em; }

/* アイテム表示 */
#itemDisplay {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
  background: rgba(0,0,0,0.7); color: #f39c12; padding: 15px 30px; border-radius: 15px;
  font-size: clamp(1rem, 4vw, 1.5rem); font-weight: bold; display: none; z-index: 60;
  text-align: center;
}

/* カウントダウン */
#countdown {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
  font-size: clamp(4rem, 15vw, 8rem); color: #fff; font-weight: bold;
  text-shadow: 0 0 30px rgba(255,255,255,0.5); display: none; z-index: 70;
}

/* ゴール画面 */
#goalScreen {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.8); display: none; flex-direction: column;
  align-items: center; justify-content: center; z-index: 200; color: #fff;
}
#goalScreen h1 { font-size: clamp(2rem, 8vw, 3.5rem); margin-bottom: 10px; }
#goalScreen .time { font-size: clamp(1rem, 4vw, 1.5rem); opacity: 0.8; margin-bottom: 30px; }
#restartBtn {
  padding: 12px 40px; font-size: clamp(1rem, 3vw, 1.3rem); border: none; border-radius: 50px;
  background: #f39c12; color: #fff; font-weight: bold; cursor: pointer;
}

/* レスポンシブ */
@media (min-width: 768px) {
  .dpad-btn { width: 70px; height: 70px; }
  .action-btn { width: 80px; height: 80px; font-size: 16px; }
}
</style>
</head>
<body>

<!-- スタート画面 -->
<div id="startScreen">
  <div class="kart-emoji">🏎️💨</div>
  <h1>MARIO KART</h1>
  <p class="subtitle">ブラウザで遊べる！スマホ対応レーシングゲーム</p>
  <button id="startBtn" onclick="startGame()">🏁 スタート！</button>
  <p style="color:rgba(255,255,255,0.6); margin-top:20px; font-size:clamp(0.7rem,2vw,0.9rem)">
    PC: WASD/矢印キー | スマホ: タッチ操作
  </p>
</div>

<!-- キャンバス -->
<canvas id="gameCanvas"></canvas>

<!-- HUD -->
<div id="hud">
  <div class="hud-box"><span class="label">LAP</span><br><span class="value" id="lapDisplay">1/3</span></div>
  <div class="hud-box"><span class="label">TIME</span><br><span class="value" id="timeDisplay">0:00</span></div>
  <div class="hud-box"><span class="label">POS</span><br><span class="value" id="posDisplay">1st</span></div>
  <div class="hud-box"><span class="label">SPEED</span><br><span class="value" id="speedDisplay">0 km/h</span></div>
</div>

<!-- アイテム表示 -->
<div id="itemDisplay"></div>

<!-- カウントダウン -->
<div id="countdown"></div>

<!-- コントロール（スマホ） -->
<div id="controls">
  <div class="ctrl-row">
    <div class="dpad">
      <div></div><div class="dpad-btn" data-key="up">▲</div><div></div>
      <div class="dpad-btn" data-key="left">◀</div><div class="dpad-center"></div><div class="dpad-btn" data-key="right">▶</div>
      <div></div><div class="dpad-btn" data-key="down">▼</div><div></div>
    </div>
    <div class="action-btns">
      <div class="action-btn" id="itemBtn" data-key="space">ITEM</div>
      <div class="action-btn" id="boostBtn" data-key="shift">BOOST</div>
    </div>
  </div>
</div>

<!-- ゴール画面 -->
<div id="goalScreen">
  <h1 id="goalTitle">🏆 ゴール！</h1>
  <p class="time" id="goalTime"></p>
  <button id="restartBtn" onclick="location.reload()">もう一度遊ぶ 🔄</button>
</div>

<script>
// ==================== ゲーム設定 ====================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// タッチ操作検出
const isMobile = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
if (isMobile) document.getElementById('controls').style.display = 'block';

// ==================== トラック定義 ====================
// ポリラインでトラックを定義（セグメントごとの曲率）
const trackPoints = [];
const trackWidth = 120;
const numTrackPts = 300;

// 楕円ベースのトラック生成
for (let i = 0; i < numTrackPts; i++) {
  const t = (i / numTrackPts) * Math.PI * 2;
  // 変形楕円で少し不規則に
  const rx = 1800 + Math.sin(t * 3) * 400;
  const ry = 1200 + Math.cos(t * 2) * 300;
  trackPoints.push({
    x: Math.cos(t) * rx,
    y: Math.sin(t) * ry
  });
}

// セグメントごとの法線を計算
const segments = [];
for (let i = 0; i < numTrackPts; i++) {
  const curr = trackPoints[i];
  const next = trackPoints[(i + 1) % numTrackPts];
  const prev = trackPoints[(i - 1 + numTrackPts) % numTrackPts];
  
  // 接線ベクトル
  let dx = next.x - prev.x;
  let dy = next.y - prev.y;
  const len = Math.sqrt(dx * dx + dy * dy);
  dx /= len; dy /= len;
  
  // 法線（左向き）
  segments.push({
    x: curr.x, y: curr.y,
    tx: dx, ty: dy,
    nx: -dy, ny: dx,
    curve: Math.abs(Math.sin(i * 0.1)) // 曲率（視覚用）
  });
}

// ==================== アイテムボックス ====================
const itemBoxes = [];
for (let i = 0; i < 8; i++) {
  const segIdx = Math.floor((i / 8) * numTrackPts);
  const seg = segments[segIdx];
  const offset = (Math.random() - 0.5) * trackWidth * 0.6;
  itemBoxes.push({
    x: seg.x + seg.nx * offset,
    y: seg.y + seg.ny * offset,
    active: true,
    respawnTimer: 0
  });
}

// ==================== オブスタクル（コーン） ====================
const cones = [];
for (let i = 0; i < 15; i++) {
  const segIdx = Math.floor(Math.random() * numTrackPts);
  const seg = segments[segIdx];
  const offset = (Math.random() - 0.5) * trackWidth * 0.7;
  cones.push({
    x: seg.x + seg.nx * offset,
    y: seg.y + seg.ny * offset,
    hit: false
  });
}

// ==================== プレイヤー ====================
const player = {
  segIdx: 10, // 開始位置
  lateralOffset: 0, // 横方向オフセット（-trackWidth/2 ~ trackWidth/2）
  speed: 0,
  maxSpeed: 8,
  acceleration: 0.15,
  deceleration: 0.05,
  turnSpeed: 3,
  angle: 0, // 画面表示用角度
  lap: 1,
  totalLaps: 3,
  checkpointsPassed: new Set(),
  finished: false,
  finishTime: 0,
  item: null,
  boostTimer: 0,
  hitTimer: 0,
  particles: []
};

// ==================== AIカー ====================
const aiCars = [
  { segIdx: 5, lateralOffset: -30, speed: 6.5, color: '#e74c3c', name: 'ルイージ', emoji: '🟢' },
  { segIdx: 15, lateralOffset: 20, speed: 7, color: '#9b59b6', name: 'ピーチ', emoji: '👑' },
  { segIdx: 8, lateralOffset: -10, speed: 6.8, color: '#3498db', name: 'キノピオ', emoji: '🍄' }
];

// ==================== キー入力 ====================
const keys = {};
window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; e.preventDefault(); });
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

// タッチ操作
const touchState = { up: false, down: false, left: false, right: false, space: false, shift: false };

document.querySelectorAll('.dpad-btn, .action-btn').forEach(btn => {
  const key = btn.dataset.key;
  
  const activate = (e) => { e.preventDefault(); touchState[key] = true; };
  const deactivate = (e) => { e.preventDefault(); touchState[key] = false; };
  
  btn.addEventListener('touchstart', activate, { passive: false });
  btn.addEventListener('touchend', deactivate);
  btn.addEventListener('touchcancel', deactivate);
  btn.addEventListener('mousedown', activate);
  btn.addEventListener('mouseup', deactivate);
});

// ==================== ゲーム状態 ====================
let gameState = 'menu'; // menu, countdown, racing, finished
let gameTime = 0;
let lastTime = 0;
const COUNTDOWN_NUMS = ['3', '2', '1', 'GO!'];
let countdownIdx = 0;

// ==================== ゲーム開始 ====================
function startGame() {
  document.getElementById('startScreen').style.display = 'none';
  gameState = 'countdown';
  countdownIdx = 0;
  
  const cdEl = document.getElementById('countdown');
  cdEl.style.display = 'block';
  
  function showCountdown() {
    if (countdownIdx < COUNTDOWN_NUMS.length) {
      cdEl.textContent = COUNTDOWN_NUMS[countdownIdx];
      cdEl.style.color = countdownIdx === COUNTDOWN_NUMS.length - 1 ? '#2ecc71' : '#fff';
      countdownIdx++;
      setTimeout(showCountdown, 800);
    } else {
      setTimeout(() => {
        cdEl.style.display = 'none';
        gameState = 'racing';
        document.getElementById('hud').style.display = 'flex';
        lastTime = performance.now();
        requestAnimationFrame(gameLoop);
      }, 500);
    }
  }
  showCountdown();
}

// ==================== ゲームループ ====================
function gameLoop(timestamp) {
  if (gameState !== 'racing') return;
  
  const dt = Math.min((timestamp - lastTime) / 16.67, 3); // 60fps基準、最大3倍
  lastTime = timestamp;
  gameTime += dt / 60;
  
  updatePlayer(dt);
  updateAI(dt);
  checkCollisions();
  updateParticles(dt);
  
  render();
  updateHUD();
  
  requestAnimationFrame(gameLoop);
}

// ==================== プレイヤー更新 ====================
function updatePlayer(dt) {
  if (player.finished) return;
  
  const isUp = keys['arrowup'] || keys['w'] || touchState.up;
  const isDown = keys['arrowdown'] || keys['s'] || touchState.down;
  const isLeft = keys['arrowleft'] || keys['a'] || touchState.left;
  const isRight = keys['arrowright'] || keys['d'] || touchState.right;
  const isBoost = keys[' '] || keys['shift'] || touchState.space || touchState.shift;
  
  // アクセラレーション
  if (isUp) {
    let spd = player.maxSpeed;
    if (player.boostTimer > 0) { spd *= 1.5; player.boostTimer -= dt; }
    player.speed = Math.min(player.speed + player.acceleration * dt, spd);
  } else if (isDown) {
    player.speed = Math.max(player.speed - player.acceleration * 1.5 * dt, -3);
  } else {
    // 自然減速
    if (player.speed > 0) player.speed = Math.max(0, player.speed - player.deceleration * dt);
    if (player.speed < 0) player.speed = Math.min(0, player.speed + player.deceleration * dt);
  }
  
  // コース外減速
  const seg = segments[player.segIdx];
  const absOffset = Math.abs(player.lateralOffset);
  if (absOffset > trackWidth / 2 - 15) {
    player.speed *= Math.max(0.3, 1 - (absOffset - trackWidth/2 + 15) * 0.02);
    // ダストパーティクル
    if (player.speed > 1 && Math.random() < 0.3) {
      addParticle(seg.x + seg.nx * player.lateralOffset, seg.y + seg.ny * player.lateralOffset, 'dust');
    }
  }
  
  // ステアリング（曲がり具合で減速）
  const curveFactor = segments[player.segIdx].curve;
  if (isLeft) {
    player.lateralOffset -= player.turnSpeed * dt * (1 - curveFactor * 0.3);
    player.angle = Math.max(player.angle - 2 * dt, -0.4);
  } else if (isRight) {
    player.lateralOffset += player.turnSpeed * dt * (1 - curveFactor * 0.3);
    player.angle = Math.min(player.angle + 2 * dt, 0.4);
  } else {
    player.angle *= 0.85; // ステアリターン
  }
  
  // 横方向制限
  const maxOffset = trackWidth / 2 - 10;
  if (player.lateralOffset > maxOffset) { player.lateralOffset = maxOffset; player.speed *= 0.95; }
  if (player.lateralOffset < -maxOffset) { player.lateralOffset = -maxOffset; player.speed *= 0.95; }
  
  // 次のセグメントへ移動
  const moveAmount = player.speed * dt;
  player.segIdx += Math.round(moveAmount);
  
  // ラップチェック
  if (player.segIdx >= numTrackPts) {
    player.segIdx -= numTrackPts;
    player.lap++;
    
    if (player.lap > player.totalLaps) {
      finishRace();
      return;
    }
  } else if (player.segIdx < 0) {
    player.segIdx += numTrackPts;
    player.lap--;
  }
  
  // パーティクル（スピード時）
  if (player.speed > 5 && Math.random() < 0.2) {
    const px = seg.x + seg.nx * player.lateralOffset;
    const py = seg.y + seg.ny * player.lateralOffset;
    addParticle(px, py, 'speed');
  }
  
  if (player.hitTimer > 0) player.hitTimer -= dt;
}

// ==================== AI更新 ====================
function updateAI(dt) {
  aiCars.forEach(ai => {
    // セグメント進行
    const speedVar = ai.speed + Math.sin(gameTime * 2 + ai.segIdx) * 1.5;
    ai.segIdx += Math.round(speedVar * dt);
    
    if (ai.segIdx >= numTrackPts) ai.segIdx -= numTrackPts;
    if (ai.segIdx < 0) ai.segIdx += numTrackPts;
    
    // 横位置を少し揺らす（自然な動き）
    ai.lateralOffset += Math.sin(gameTime * 1.5 + ai.segIdx * 0.05) * 2 * dt;
    ai.lateralOffset = Math.max(-trackWidth/3, Math.min(trackWidth/3, ai.lateralOffset));
  });
}

// ==================== 衝突判定 ====================
function checkCollisions() {
  const px = segments[player.segIdx].x + segments[player.segIdx].nx * player.lateralOffset;
  const py = segments[player.segIdx].y + segments[player.segIdx].ny * player.lateralOffset;
  
  // アイテムボックス
  itemBoxes.forEach(box => {
    if (!box.active) return;
    const dx = px - box.x;
    const dy = py - box.y;
    if (Math.sqrt(dx*dx + dy*dy) < 30) {
      box.active = false;
      box.respawnTimer = 180; // 3秒（60fps）
      giveItem();
    }
  });
  
  // コーン
  cones.forEach(cone => {
    if (cone.hit || player.hitTimer > 0) return;
    const dx = px - cone.x;
    const dy = py - cone.y;
    if (Math.sqrt(dx*dx + dy*dy) < 25) {
      cone.hit = true;
      player.speed *= 0.5;
      player.hitTimer = 30;
      addParticle(cone.x, cone.y, 'hit');
    }
  });
  
  // AIとの衝突（近いセグメントにいる場合）
  aiCars.forEach(ai => {
    const segDiff = Math.abs(player.segIdx - ai.segIdx);
    if (segDiff < 3 || segDiff > numTrackPts - 3) {
      const latDiff = Math.abs(player.lateralOffset - ai.lateralOffset);
      if (latDiff < 40) {
        // 衝突！両方少し弾かれる
        const pushDir = player.lateralOffset > ai.lateralOffset ? 1 : -1;
        player.lateralOffset += pushDir * 5;
        ai.lateralOffset -= pushDir * 3;
        player.speed *= 0.8;
        addParticle(px, py, 'hit');
      }
    }
  });
}

// ==================== アイテム ====================
function giveItem() {
  const items = ['🍌', '🥚', '⭐', '🔴', '🟢'];
  player.item = items[Math.floor(Math.random() * items.length)];
  
  const el = document.getElementById('itemDisplay');
  el.textContent = `アイテム獲得！ ${player.item}`;
  el.style.display = 'block';
  setTimeout(() => { el.style.display = 'none'; }, 1500);
}

function useItem() {
  if (!player.item) return;
  
  switch(player.item) {
    case '🍌': // バナナ（後方爆発）
      addParticle(
        segments[player.segIdx].x + segments[player.segIdx].nx * player.lateralOffset,
        segments[player.segIdx].y + segments[player.segIdx].ny * player.lateralOffset, 'banana'
      );
      // AIを遅くする
      aiCars.forEach(ai => {
        const segDiff = Math.abs(player.segIdx - ai.segIdx);
        if (segDiff < 10) ai.speed *= 0.5;
      });
      break;
    case '🥚': // エッグ（前方投射）
      player.boostTimer = 60;
      addParticle(
        segments[player.segIdx].x + segments[player.segIdx].tx * 100,
        segments[player.segIdx].y + segments[player.segIdx].ty * 100, 'egg'
      );
      break;
    case '⭐': // スター（無敵＋加速）
      player.boostTimer = 180;
      player.hitTimer = -999; // 無敵
      break;
    case '🔴': // 赤い花（前方弾）
      aiCars.forEach(ai => {
        const segDiff = Math.abs(player.segIdx - ai.segIdx);
        if (segDiff < 8) { ai.speed *= 0.3; addParticle(
          segments[ai.segIdx].x + segments[ai.segIdx].nx * ai.lateralOffset,
          segments[ai.segIdx].y + segments[ai.segIdx].ny * ai.lateralOffset, 'hit'
        ); }
      });
      break;
    case '🟢': // 緑の花（加速）
      player.boostTimer = 120;
      break;
  }
  
  player.item = null;
}

// キーでアイテム使用
window.addEventListener('keydown', e => {
  if (e.key === 'z' || e.key === 'x') useItem();
});

// ==================== パーティクル ====================
function addParticle(x, y, type) {
  const count = type === 'hit' ? 10 : 5;
  for (let i = 0; i < count; i++) {
    player.particles.push({
      x: x + (Math.random() - 0.5) * 20,
      y: y + (Math.random() - 0.5) * 20,
      vx: (Math.random() - 0.5) * 4,
      vy: (Math.random() - 0.5) * 4,
      life: type === 'hit' ? 30 : 15,
      maxLife: type === 'hit' ? 30 : 15,
      color: type === 'dust' ? '#8B7355' : type === 'speed' ? '#aaa' : 
             type === 'banana' ? '#f1c40f' : type === 'egg' ? '#fff' : '#e74c3c',
      size: type === 'hit' ? 4 + Math.random() * 4 : 2 + Math.random() * 2
    });
  }
}

function updateParticles(dt) {
  player.particles = player.particles.filter(p => {
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life -= dt;
    return p.life > 0;
  });
  
  // アイテムボックスリスポーン
  itemBoxes.forEach(box => {
    if (!box.active) {
      box.respawnTimer -= dt;
      if (box.respawnTimer <= 0) box.active = true;
    }
  });
}

// ==================== レンダリング ====================
function render() {
  // 背景（空）
  ctx.fillStyle = '#87CEEB';
  ctx.fillRect(0, 0, W, H);
  
  // グリッド（地面表現）
  drawGround();
  
  // カメラ位置をプレイヤーに設定
  const seg = segments[player.segIdx];
  const camX = seg.x + seg.nx * player.lateralOffset;
  const camY = seg.y + seg.ny * player.lateralOffset;
  
  ctx.save();
  ctx.translate(W/2, H/2);
  
  // カメラ回転（進行方向を上に）
  ctx.rotate(Math.atan2(-seg.tx, -seg.ty));
  
  // 相対座標に変換
  const drawSeg = (s) => {
    const rx = s.x - camX;
    const ry = s.y - camY;
    return { x: rx, y: ry };
  };
  
  // トラック描画
  drawTrack();
  
  // アイテムボックス
  itemBoxes.forEach(box => {
    if (!box.active) return;
    const bx = box.x - camX;
    const by = box.y - camY;
    
    // 画面内チェック
    if (Math.abs(bx) > W || Math.abs(by) > H) return;
    
    ctx.fillStyle = '#f39c12';
    ctx.fillRect(bx - 8, by - 8, 16, 16);
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.strokeRect(bx - 8, by - 8, 16, 16);
    
    // ? マーク
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 12px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('?', bx, by + 4);
  });
  
  // コーン
  cones.forEach(cone => {
    const cx = cone.x - camX;
    const cy = cone.y - camY;
    if (Math.abs(cx) > W || Math.abs(cy) > H) return;
    
    ctx.fillStyle = cone.hit ? '#666' : '#e74c3c';
    ctx.beginPath();
    ctx.moveTo(cx, cy - 10);
    ctx.lineTo(cx - 6, cy + 5);
    ctx.lineTo(cx + 6, cy + 5);
    ctx.closePath();
    ctx.fill();
    
    // 白線
    ctx.fillStyle = '#fff';
    ctx.fillRect(cx - 3, cy - 2, 6, 3);
  });
  
  // AIカー描画
  aiCars.forEach(ai => {
    const aiseg = segments[ai.segIdx];
    const ax = aiseg.x + aiseg.nx * ai.lateralOffset - camX;
    const ay = aiseg.y + aiseg.ny * ai.lateralOffset - camY;
    
    if (Math.abs(ax) > W || Math.abs(ay) > H) return;
    
    drawCar(ax, ay, aiseg, ai.color, ai.emoji);
  });
  
  // プレイヤーカー描画
  const px = seg.x + seg.nx * player.lateralOffset - camX;
  const py = seg.y + seg.ny * player.lateralOffset - camY;
  
  if (player.hitTimer > 0 && player.hitTimer !== -999) {
    ctx.globalAlpha = 0.5 + Math.sin(gameTime * 20) * 0.3;
  }
  drawCar(px, py, seg, '#e74c3c', '🏎️');
  
  // スター無敵エフェクト
  if (player.hitTimer === -999) {
    ctx.strokeStyle = `hsl(${gameTime * 100 % 360}, 100%, 50%)`;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(px, py, 25 + Math.sin(gameTime * 10) * 5, 0, Math.PI * 2);
    ctx.stroke();
  }
  
  ctx.globalAlpha = 1;
  
  // パーティクル
  player.particles.forEach(p => {
    const px2 = p.x - camX;
    const py2 = p.y - camY;
    if (Math.abs(px2) > W || Math.abs(py2) > H) return;
    
    ctx.globalAlpha = p.life / p.maxLife;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(px2, py2, p.size * (p.life / p.maxLife), 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
  
  ctx.restore();
}

function drawGround() {
  // 地面のグラデーション
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#2d5a27');
  grad.addColorStop(1, '#4a8c3f');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
}

function drawTrack() {
  // アスファルト
  ctx.beginPath();
  
  // 右端
  for (let i = 0; i < numTrackPts; i++) {
    const s = segments[i];
    const rx = s.x + s.nx * trackWidth/2 - W/2;
    const ry = s.y + s.ny * trackWidth/2 - H/2;
    if (i === 0) ctx.moveTo(rx, ry);
    else ctx.lineTo(rx, ry);
  }
  
  // 左端（逆順）
  for (let i = numTrackPts - 1; i >= 0; i--) {
    const s = segments[i];
    const lx = s.x - s.nx * trackWidth/2 - W/2;
    const ly = s.y - s.ny * trackWidth/2 - H/2;
    ctx.lineTo(lx, ly);
  }
  
  ctx.closePath();
  ctx.fillStyle = '#555';
  ctx.fill();
  
  // 縁石（赤白）
  for (let i = 0; i < numTrackPts; i++) {
    const s = segments[i];
    const isRed = Math.floor(i / 3) % 2 === 0;
    
    [1, -1].forEach(side => {
      const cx = s.x + s.nx * (trackWidth/2 * side) - W/2;
      const cy = s.y + s.ny * (trackWidth/2 * side) - H/2;
      
      ctx.fillStyle = isRed ? '#e74c3c' : '#fff';
      ctx.fillRect(cx - 5, cy - 5, 10, 10);
    });
  }
  
  // 中央線（点線）
  ctx.setLineDash([20, 20]);
  ctx.strokeStyle = 'rgba(255,255,255,0.3)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  for (let i = 0; i < numTrackPts; i++) {
    const s = segments[i];
    if (i === 0) ctx.moveTo(s.x - W/2, s.y - H/2);
    else ctx.lineTo(s.x - W/2, s.y - H/2);
  }
  ctx.closePath();
  ctx.stroke();
  ctx.setLineDash([]);
  
  // スタート/ゴールライン
  const startSeg = segments[0];
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(
    startSeg.x + startSeg.nx * trackWidth/2 - W/2,
    startSeg.y + startSeg.ny * trackWidth/2 - H/2
  );
  ctx.lineTo(
    startSeg.x - startSeg.nx * trackWidth/2 - W/2,
    startSeg.y - startSeg.ny * trackWidth/2 - H/2
  );
  ctx.stroke();
  
  // チェッカーパターン
  const sqSize = 10;
  for (let r = 0; r < 2; r++) {
    for (let c = 0; c < Math.floor(trackWidth / sqSize); c++) {
      if ((r + c) % 2 === 0) {
        const t = c * sqSize - trackWidth/2 + sqSize/2;
        ctx.fillStyle = '#fff';
        ctx.fillRect(
          startSeg.x + startSeg.nx * t - W/2 - sqSize/2,
          startSeg.y + startSeg.ny * t - H/2 - sqSize/2,
          sqSize, sqSize
        );
      }
    }
  }
}

function drawCar(x, y, seg, color, emoji) {
  ctx.save();
  ctx.translate(x, y);
  
  // カースタイル（シンプル）
  const carW = 16;
  const carH = 28;
  
  // シャドウ
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.ellipse(2, 4, carW/2 + 2, carH/2 - 2, 0, 0, Math.PI * 2);
  ctx.fill();
  
  // ボディ
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.roundRect(-carW/2, -carH/2, carW, carH, 5);
  ctx.fill();
  
  // ウィンドウ
  ctx.fillStyle = '#87CEEB';
  ctx.fillRect(-carW/4, -carH/4, carW/2, carH/6);
  
  // タイヤ
  ctx.fillStyle = '#333';
  const tirePositions = [[-carW/2-1, -carH/3], [carW/2+1, -carH/3], [-carW/2-1, carH/4], [carW/2+1, carH/4]];
  tirePositions.forEach(([tx, ty]) => {
    ctx.fillRect(tx - 2, ty - 3, 4, 6);
  });
  
  // Emoji
  ctx.font = '18px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(emoji, 0, 5);
  
  ctx.restore();
}

// ==================== HUD更新 ====================
function updateHUD() {
  document.getElementById('lapDisplay').textContent = `${Math.min(player.lap, player.totalLaps)}/${player.totalLaps}`;
  
  const mins = Math.floor(gameTime / 60);
  const secs = Math.floor(gameTime % 60);
  document.getElementById('timeDisplay').textContent = `${mins}:${secs.toString().padStart(2, '0')}`;
  
  // 順位計算
  let pos = 1;
  aiCars.forEach(ai => {
    if (ai.segIdx > player.segIdx) pos++;
  });
  const ordinals = ['st', 'nd', 'rd'];
  document.getElementById('posDisplay').textContent = `${pos}${ordinals[pos-1] || 'th'}`;
  
  document.getElementById('speedDisplay').textContent = `${Math.floor(player.speed * 30)} km/h`;
}

// ==================== ゴール ====================
function finishRace() {
  player.finished = true;
  gameState = 'finished';
  player.finishTime = gameTime;
  
  let pos = 1;
  aiCars.forEach(ai => {
    if (ai.segIdx > player.segIdx) pos++;
  });
  
  const ordinals = ['🥇', '🥈', '🥉'];
  document.getElementById('goalTitle').textContent = `${ordinals[pos-1] || pos + '位'} ゴール！`;
  
  const mins = Math.floor(player.finishTime / 60);
  const secs = Math.floor(player.finishTime % 60);
  document.getElementById('goalTime').textContent = `タイム: ${mins}:${secs.toString().padStart(2, '0')}`;
  
  setTimeout(() => {
    document.getElementById('goalScreen').style.display = 'flex';
  }, 1000);
}

// ==================== roundRect polyfill ====================
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
    if (typeof r === 'number') r = [r];
    const rad = r[0] || 0;
    this.moveTo(x + rad, y);
    this.lineTo(x + w - rad, y);
    this.quadraticCurveTo(x + w, y, x + w, y + rad);
    this.lineTo(x + w, y + h - rad);
    this.quadraticCurveTo(x + w, y + h, x + w - rad, y + h);
    this.lineTo(x + rad, y + h);
    this.quadraticCurveTo(x, y + h, x, y + h - rad);
    this.lineTo(x, y + rad);
    this.quadraticCurveTo(x, y, x + rad, y);
    this.closePath();
  };
}

// ==================== タッチでアイテム使用 ====================
document.getElementById('itemBtn').addEventListener('touchstart', (e) => {
  e.preventDefault();
  useItem();
});
